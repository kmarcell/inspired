<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">

</head>
<body style="font-family: system-ui, -apple-system, sans-serif; background-color: #0f172a; color: #f8fafc; padding: 40px 20px; margin: 0;">
  <div style="max-width: 560px; margin: 0 auto; background-color: #1e293b; border: 1px solid #334155; border-radius: 24px; padding: 32px; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);">
    <div style="text-align: center; margin-bottom: 24px;">
      <div style="width: 56px; height: 56px; background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899); border-radius: 16px; display: inline-flex; align-items: center; justify-content: center; font-size: 28px; font-weight: bold; color: white;">
        I
      </div>
      <h1 style="font-size: 22px; font-weight: 800; margin-top: 16px; color: #ffffff;">You're Invited to Staging Preview! 🧘‍♀️</h1>
