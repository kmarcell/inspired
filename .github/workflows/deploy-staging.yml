name: Deploy PWA Staging

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  deploy-staging:
    name: Build & Deploy Staging
    runs-on: ubuntu-latest
    if: github.repository == 'kmarcell/inspired'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'
          cache-dependency-path: 'pnpm-lock.yaml'

      - name: Install PWA Dependencies
        run: pnpm install --frozen-lockfile
        working-directory: ./Apps/PWA

      - name: Lint & Type Check
        run: pnpm run build:staging
        working-directory: ./Apps/PWA
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING }}

      - name: Authenticate Firebase Service Account
        run: |
          echo "$FIREBASE_SERVICE_ACCOUNT_KEY" > /tmp/firebase-key.json
        env:
          FIREBASE_SERVICE_ACCOUNT_KEY: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}

      - name: Install Functions Dependencies
        run: npm ci || npm install
        working-directory: ./infrastructure/backend/functions

      - name: Deploy Firestore Rules, Indexes & Cloud Functions to Staging
        run: npx firebase-tools deploy --only firestore,functions --force --project inspired-yoga-app-staging
        env:
          GOOGLE_APPLICATION_CREDENTIALS: /tmp/firebase-key.json

      - name: Deploy to Firebase Staging
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_STAGING }}'
          projectId: inspired-yoga-app-staging
          channelId: live
