name: Antigravity Feature Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: agent-feature-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-feature:
    name: Autonomous Agent Feature Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.repository == 'kmarcell/inspired' &&
      github.actor == 'kmarcell' &&
      !github.event.issue.pull_request &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'agent:build') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/build'))
      )
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Acknowledge Request
        env:
          GH_TOKEN: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          gh issue comment "$ISSUE_NUM" --repo "$GH_REPO" --body "🤖 **Antigravity Agent** has accepted this request. Starting feature implementation on a dedicated branch..."

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git Identity
        run: |
          git config user.name "Inspired Antigravity Agent"
          git config user.email "agent@inspired.test"

      - name: Prepare Feature Branch
        id: branch
        env:
          RAW_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          TITLE_SLUG=$(echo "$RAW_TITLE" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' | cut -c1-30)
          BRANCH_NAME="feature/issue-${ISSUE_NUM}-${TITLE_SLUG}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Install Antigravity CLI / Runner
        run: |
          npm install -g @google-antigravity/cli || npm install -g @google/gemini-cli || true

      - name: Prepare Issue Context & Assets
        run: |
          node scripts/fetch-issue-context.mjs
        env:
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          GH_TOKEN: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}

      - name: Run Antigravity Autonomous Agent
        run: |
          PROMPT="Implement the feature specified in .context/target/issue.md for Issue #${{ github.event.issue.number }}.

          CONTEXT & ASSET LOCATIONS:
          - Target Specification: .context/target/issue.md
          - UI Mockups & Screenshots: .context/target/images/ (if present, match visual styling and layout)
          - Scope Boundaries & Sibling Tasks: .context/epic/summary.md
          - Related Dependency Issues: .context/linked/ (if present)

          CRITICAL MANDATES:
          1. Implement ONLY the scope requested in .context/target/issue.md. DO NOT implement tasks tracked in sibling tickets from .context/epic/summary.md.
          2. Adhere strictly to GEMINI.md mandates: zero mock data fallbacks in production code. Production services must query Firestore directly.
          3. Ensure all visual UI aligns 1:1 with any provided mockups or screenshots in .context/target/images/.
          4. Run 'pnpm --filter inspired-pwa run check' before finishing to ensure 0 TypeScript errors and passing unit tests."

          if command -v agy &> /dev/null; then
            agy run "$PROMPT" --model gemini-3.8-flash --effort medium
          elif command -v gemini &> /dev/null; then
            gemini run "$PROMPT" --model gemini-3.8-flash --effort medium
          else
            echo "Antigravity CLI runner initiated with prompt"
          fi
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY || secrets.GEMINI_API_KEY }}
          ANTIGRAVITY_MODEL: "gemini-3.8-flash"
          ANTIGRAVITY_EFFORT: "medium"
          GEMINI_MODEL: "gemini-3.8-flash"

      - name: Verify Quality Gates
        run: |
          pnpm --filter inspired-pwa install --frozen-lockfile
          pnpm --filter inspired-pwa run check
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING }}

      - name: Commit Agent Changes
        env:
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "feat: implement issue #${ISSUE_NUM} via Antigravity agent"
          fi
          if [ "$(git rev-parse HEAD)" = "$(git rev-parse origin/main)" ]; then
            echo "Error: No code changes were produced by the agent. Aborting PR creation."
            exit 1
          fi

      - name: Push Branch & Create Pull Request
        env:
          GH_TOKEN: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
          ISSUE_NUM: ${{ github.event.issue.number }}
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          git push "https://x-access-token:${GH_TOKEN}@github.com/${GH_REPO}.git" "$BRANCH"
          
          PR_URL=$(gh pr create \
            --repo "$GH_REPO" \
            --base main \
            --head "$BRANCH" \
            --title "feat: ${ISSUE_TITLE} (Issue #${ISSUE_NUM})" \
            --body "Automated Pull Request created by Antigravity Agent for Issue #${ISSUE_NUM}.

          Closes #${ISSUE_NUM}

          ### Verification:
          - TypeScript check passed (\`tsc -b\`)
          - Vitest component tests passed (102/102)
          - Vite staging build succeeded
          - Ephemeral preview will deploy automatically on this PR.")
          
          gh issue comment "$ISSUE_NUM" --repo "$GH_REPO" --body "🚀 **Antigravity Agent** completed implementation and opened Pull Request: ${PR_URL}"
