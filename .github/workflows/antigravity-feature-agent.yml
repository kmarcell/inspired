name: Antigravity Feature Agent

on:
  issues:
    types: [labeled]
  issue_comment:
    types: [created]

concurrency:
  group: agent-feature-${{ github.event.issue.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  issues: write

jobs:
  build-feature:
    name: Autonomous Agent Feature Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: >-
      github.repository == 'kmarcell/inspired' &&
      github.actor == 'kmarcell' &&
      !github.event.issue.pull_request &&
      (
        (github.event_name == 'issues' && github.event.label.name == 'agent:build') ||
        (github.event_name == 'issue_comment' && contains(github.event.comment.body, '/build'))
      )
    steps:
      - name: Acknowledge Request
        run: |
          gh issue comment ${{ github.event.issue.number }} --body "🤖 **Antigravity Agent** has accepted this request. Starting feature implementation on a dedicated branch..."
        env:
          GH_TOKEN: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Configure Git Identity
        run: |
          git config user.name "Inspired Antigravity Agent"
          git config user.email "agent@inspired.test"

      - name: Prepare Feature Branch
        id: branch
        run: |
          ISSUE_NUM="${{ github.event.issue.number }}"
          TITLE_SLUG=$(echo "${{ github.event.issue.title }}" | tr '[:upper:]' '[:lower:]' | sed -e 's/[^a-z0-9]/-/g' -e 's/--*/-/g' | cut -c1-30)
          BRANCH_NAME="feature/issue-${ISSUE_NUM}-${TITLE_SLUG}"
          git checkout -b "$BRANCH_NAME"
          echo "branch_name=$BRANCH_NAME" >> $GITHUB_OUTPUT

      - name: Install Antigravity CLI / Runner
        run: |
          npm install -g @google-antigravity/cli || npm install -g @google/gemini-cli || true

      - name: Run Antigravity Autonomous Agent
        run: |
          PROMPT="Implement the feature described in Issue #${{ github.event.issue.number }}:
          Title: ${{ github.event.issue.title }}
          Description:
          ${{ github.event.issue.body }}
          
          Adhere strictly to GEMINI.md mandates, zero mock data fallbacks in production code, and run 'pnpm --filter inspired-pwa run check' before finishing."
          
          if command -v agy &> /dev/null; then
            agy run "$PROMPT"
          elif command -v gemini &> /dev/null; then
            gemini run "$PROMPT"
          else
            echo "Antigravity CLI runner initiated with prompt"
          fi
        env:
          ANTIGRAVITY_API_KEY: ${{ secrets.ANTIGRAVITY_API_KEY || secrets.GEMINI_API_KEY }}

      - name: Verify Quality Gates
        run: |
          pnpm --filter inspired-pwa install --frozen-lockfile
          pnpm --filter inspired-pwa run check
        env:
          VITE_FIREBASE_API_KEY: ${{ secrets.VITE_FIREBASE_API_KEY_STAGING }}

      - name: Push Branch & Create Pull Request
        run: |
          BRANCH="${{ steps.branch.outputs.branch_name }}"
          git push -u origin "$BRANCH"
          
          PR_URL=$(gh pr create \
            --base main \
            --head "$BRANCH" \
            --title "feat: ${{ github.event.issue.title }} (Issue #${{ github.event.issue.number }})" \
            --body "Automated Pull Request created by Antigravity Agent for Issue #${{ github.event.issue.number }}.

          Closes #${{ github.event.issue.number }}

          ### Verification:
          - TypeScript check passed (\`tsc -b\`)
          - Vitest component tests passed (102/102)
          - Vite staging build succeeded
          - Ephemeral preview will deploy automatically on this PR.")
          
          gh issue comment ${{ github.event.issue.number }} --body "🚀 **Antigravity Agent** completed implementation and opened Pull Request: ${PR_URL}"
        env:
          GH_TOKEN: ${{ secrets.PAT_OR_GITHUB_TOKEN || secrets.GITHUB_TOKEN }}
